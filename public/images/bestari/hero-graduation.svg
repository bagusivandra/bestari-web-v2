<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C5A572" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#171A20" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0C0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0F" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0B0C0F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0C0F" stop-opacity="1"/>
    </linearGradient>
    <filter id="cinematicBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0B0C0F"/>
  <rect width="100%" height="100%" fill="url(#goldGlow)"/>

  <!-- Architectural Columns / Campus Silhouette -->
  <g opacity="0.12" fill="#F2F1ED">
    <rect x="200" y="300" width="80" height="600"/>
    <rect x="360" y="300" width="80" height="600"/>
    <rect x="520" y="300" width="80" height="600"/>
    <rect x="1000" y="300" width="80" height="600"/>
    <rect x="1160" y="300" width="80" height="600"/>
    <rect x="1320" y="300" width="80" height="600"/>
    <path d="M150 300 Q800 120 1450 300 Z"/>
  </g>

  <!-- Dramatic Silhouette of Graduate throwing Cap -->
  <g transform="translate(680, 240)" fill="#111318" stroke="#C5A572" stroke-width="1.5">
    <!-- Cap Flying -->
    <path d="M120 -80 L180 -105 L240 -80 L180 -55 Z" fill="#C5A572" stroke="#D8C49D" stroke-width="2"/>
    <path d="M170 -65 L170 -30 L180 -25 L190 -30 L190 -65 Z" fill="#D8C49D"/>
    <line x1="180" y1="-55" x2="205" y2="-40" stroke="#D8C49D" stroke-width="2"/>

    <!-- Graduate Silhouette -->
    <ellipse cx="120" cy="80" rx="36" ry="46" fill="#171A20"/>
    <path d="M60 140 Q120 120 180 140 L230 480 Q120 510 10 480 Z" fill="#171A20" stroke="#C5A572" stroke-width="1"/>
    <!-- Sash with gold accent -->
    <path d="M80 140 L160 360 L140 370 L70 150 Z" fill="#C5A572" opacity="0.9"/>
  </g>

  <!-- Warm Bokeh Particles -->
  <circle cx="320" cy="220" r="140" fill="#C5A572" opacity="0.08" filter="url(#cinematicBlur)"/>
  <circle cx="1280" cy="380" r="180" fill="#D8C49D" opacity="0.06" filter="url(#cinematicBlur)"/>
  <circle cx="780" cy="180" r="90" fill="#C5A572" opacity="0.12" filter="url(#cinematicBlur)"/>

  <!-- Vignette and Dark Overlay -->
  <rect width="100%" height="100%" fill="url(#overlayGrad)"/>

  <!-- Brand Typography Watermark / Editorial Tag -->
  <text x="800" y="760" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="12" fill="#F2F1ED" opacity="0.9">BESTARI GRADUATION</text>
  <text x="800" y="800" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="4" fill="#C5A572">#WhereDreamsMeetReality · Malang &amp; Surabaya</text>
</svg>
