<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <radialGradient id="coupleGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#C5A572" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#111318" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0C0F" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0B0C0F"/>
  <rect width="100%" height="100%" fill="url(#coupleGlow)"/>

  <!-- Couple Silhouettes -->
  <g transform="translate(430, 360)">
    <!-- Person 1 (Graduate) -->
    <path d="M-90 -160 L-30 -185 L30 -160 L-30 -135 Z" fill="#C5A572"/>
    <ellipse cx="-30" cy="-75" rx="42" ry="52" fill="#171A20" stroke="#292D35"/>
