    <path d="M-50 15 Q20 10 90 15 L100 290 L-60 290 Z" fill="#1D2027"/>
    <!-- Bouquet -->
    <circle cx="-25" cy="80" r="28" fill="#C5A572" opacity="0.75"/>
    <circle cx="-15" cy="65" r="18" fill="#D8C49D" opacity="0.9"/>
    <circle cx="-35" cy="70" r="16" fill="#8F7242" opacity="0.8"/>
  </g>

  <rect x="20" y="20" width="960" height="710" fill="none" stroke="#292D35" stroke-width="1"/>
  <text x="500" y="680" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="4" fill="#C5A572">BESTARI COUPLE GRADUATION · STORY IN HARMONY</text>
</svg>
